# ============================================================
# multiomics-core — Proteomics configuration template
# Copy this file and adjust ONLY the fields marked as REQUIRED.
# Do NOT edit R code to start a new project.
# ============================================================

# ============================================================
# Project identity + I/O roots (REQUIRED)
# ============================================================
project:
  dir: "/full-path/to/project_dir"   # REQUIRED: absolute path to the project folder (outside the repo)
  name: "<PROJECT_NAME>"             # REQUIRED: short project identifier
  analysis_round: "A01"              # REQUIRED: analysis iteration / round (e.g., A01, A02...)

# Paths are RELATIVE to project.dir
paths:
  raw: "data"         # where input data lives under project.dir
  out: "outputs"      # where outputs will be written under project.dir

# ============================================================
# Proteomics mode configuration
# ============================================================
modes:
  proteomics:

    # --------------------------------------------------------
    # Data origin / engine
    # --------------------------------------------------------
    engine: "DIANN"          # e.g. DIANN / MaxQuant / FragPipe
    scale_in: "linear" # If the data already transformed : "log" other wise: "linear"

    # --------------------------------------------------------
    # Input files (REQUIRED)
    # Paths are RELATIVE to: project.dir / paths.raw
    # --------------------------------------------------------
    files:
      protein:    "proteomics/protein_matrix.csv"
      sample_map: "proteomics/sample_map.csv"
      metadata:   "proteomics/meta_prot.csv"
      contrasts:  "proteomics/contrasts_prot.csv"
      peptides:   ""              # optional peptide-level intensity matrix (enables Peptide Explorer in report)

    # --------------------------------------------------------
    # Column naming conventions (REQUIRED)
    # --------------------------------------------------------
    id_columns:
      protein_id: "Protein.Group"
      sample_col: "SampleID"

      protein_annot:
        - "Protein.Names"
        - "Genes"
        - "First.Protein.Description"

      map_from: "sample_orig_name"
      map_to:   "SampleID"

    # --------------------------------------------------------
    # Filtering
    # --------------------------------------------------------
    filtering:
      min_count:
        default: 3
        # Optional per-condition override:
        # Control: 3
        # Treatment: 2

    # --------------------------------------------------------
    # Normalization
    # --------------------------------------------------------
    normalization:
      method: "none"      # "none" or "median"

    # --------------------------------------------------------
    # Multiple imputation
    # --------------------------------------------------------
    imputation:
      method: "perseus"    # "none" | "perseus" | "dep2"

      no_repetitions: 10
      min_no_passed: 8

      # Perseus-style parameters
      width: 0.2
      downshift: 1.6

      # DEP2 parameters (future implementation)
      dep2_method: "MinDet"
      dep2_random_seed: 1

    # --------------------------------------------------------
    # Differential expression
    # --------------------------------------------------------
    de:
      method: "limma"
      use_adj_for_pass1: true
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5

    # --------------------------------------------------------
    # How to interpret DE summary tables (used by get_de_features, QC_post, etc.)
    # --------------------------------------------------------
    de_table:
      id_col: "FeatureID"
      pass_any_col: "pass_any_contrast"

    # --------------------------------------------------------
    # QC_post (plots/tables that depend on DE results)
    # --------------------------------------------------------
    qc_post:
      enabled: true
      de_source: "table1"   # "summary" | "table1"
      plots:
        volcano: true
        ma: true
      outputs:
        write_de_tables: true   # writes per-contrast tables derived from the chosen source

    # --------------------------------------------------------
    # Clustering (optional; enable only if you want it)
    # --------------------------------------------------------
    clustering:
      enabled: false
      group_col: "Condition"        # metadata column for clustering group logic

      # Which DE features to cluster.
      # "any_contrast" = pass_any_col == 1
      de_source: "any_contrast"

      # Run steps that require multiple conditions only if enough groups exist
      min_groups: 2

      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"
          k: null

        partition:
          enabled: true
          algorithm: "hclust"   # "kmeans" | "pam" | "hclust"
          distance: "euclidean"
          k: null
          k_max: 20
          nstart: 25
          x_axis_col: null           # Metadata column for profile plot X-axis (defaults to group_col)
          color_col: null            # Optional metadata column for color/linetype grouping in profile plots
        binary_patterns:
          enabled: true
          corr_cutoff: 0.8
          counts_cutoff: 0

      heatmap:
        max_rows: null
        cluster_cols: true

    # --------------------------------------------------------
    # Plotting / QC aesthetics
    # --------------------------------------------------------
    effects:
      color: "Condition"
      shape: null
      samples: "SampleID"

    # --------------------------------------------------------
    # Report customization
    # --------------------------------------------------------
    report:
      project_id: ""                       # Shown in report title (e.g. "EP-2025-001")
      introduction_text: ""                # Main introduction paragraph
      introduction_background: ""          # Optional: Background subsection
      introduction_aim: ""                 # Optional: Aim subsection
      experimental_design_file: ""         # Path or URL to experimental design (shown in intro)
      raw_files_location: ""               # URL or path to raw data files
      analysis_files_location: ""          # URL or path to analysis output files
      full_results_table_link: ""          # URL or path to full DE results table
      expected_proteins_file: ""           # CSV with columns: label, count (bar chart of expected proteins)

      # QC plot visibility (all true by default except distance heatmap)
      show_pca: true
      show_density: true
      show_distance: false
      show_correlation: true
      show_expression_heatmap: true
      show_imputation_qc: true
      show_identified_proteins_venn: false  # Pre-imputation identified proteins Venn diagram
      force_pca: false                     # Force PCA even with <2 replicates per group

      # Text overrides (leave empty for auto-generated text)
      stats_methods_text: ""               # Custom DE statistics description in Results section
      stats_section_text: ""               # Custom statistical analysis text in Methods section
      disclaimer_text: ""                  # Legal disclaimer (shown verbatim if non-empty)

    # --------------------------------------------------------
    # Excel export configuration
    # --------------------------------------------------------
    excel:
      # Metadata columns to display as annotation rows above the data table.
      # Set to null to use all metadata columns, or specify a list:
      annotation_rows: null
      # Metadata columns to concatenate for informative sample column headers.
      # Set to null to keep original sample IDs:
      sample_label_cols: null

    # --------------------------------------------------------
    # Annotation / Organism
    # --------------------------------------------------------
    annotation:
      organism: "Homo sapiens"      # or "auto", "Mus musculus", etc.
      id_type: "auto"               # "auto" | "symbol" | "uniprot" | "ensembl_peptide"
      skip_annotation: false
      custom_mapping_file: null      # CSV/TSV with protein_id + gene_name columns (for non-model organisms)

    # --------------------------------------------------------
    # QC advanced settings
    # --------------------------------------------------------
    qc:
      run_umap: true
      umap_n_neighbors: 15
      umap_min_dist: 0.1
      outlier_sd_threshold: 3
      min_sample_correlation: 0.8
      top_de_heatmap_sizes: [25, 50, 100]

    # --------------------------------------------------------
    # Pathway enrichment
    # Organism is read from annotation.organism above (single source of truth)
    # --------------------------------------------------------
    pathway:
      enabled: true
      method: "both"          # "fgsea" | "ora" | "both"
      databases: ["GO", "KEGG", "Reactome"]  # "all" = GO+KEGG+Reactome; "GO" loads BP+CC+MF; or pick: "GO_BP", "GO_CC", "GO_MF", "KEGG", "Reactome"
      gmt_file: null          # Custom GMT file for non-model organisms
      min_size: 10
      max_size: 500
      gsea_ranking: "stat"    # "stat" | "abs_lfc" | "lfc"
      pathway_volcano: true   # produce pathway-colored volcano data for report

      # GO term simplification — cluster semantically similar GO terms
      # and keep only the most significant per cluster (uses rrvgo)
      simplify_go: true             # true = reduce redundant GO terms
      simplify_threshold: 0.7       # 0-1: higher = more aggressive merging
      simplify_measure: "Wang"      # "Wang" | "Rel" | "Resnik" | "Lin" | "Jiang"
      cluster_threshold: 0.7  # semantic similarity threshold for term clustering (0-1, lower = more merging)

    # --------------------------------------------------------
    # PPI network analysis
    # Species ID is derived from annotation.organism automatically.
    # Override with species: <taxid> only if auto-derivation fails.
    # --------------------------------------------------------
    ppi:
      enabled: true
      # species: 9606         # Derived from annotation.organism; uncomment to override
      significance_threshold: 0.05
      lfc_threshold: 0
      string_score_threshold: 400
      active_subnetwork: true
      complex_analysis: true

    # --------------------------------------------------------
    # Protein domain & functional feature analysis
    # --------------------------------------------------------
    domain_analysis:
      enabled: true               # InterPro/Pfam enrichment + UniProt features

    # --------------------------------------------------------
    # Advanced statistics
    # --------------------------------------------------------
    advanced_stats:
      enabled: true
      compute_effect_size_ci: true
      bootstrap_n: 1000
      ci_level: 0.95
      run_robust_regression: false
      run_power_analysis: true
      random_effects: null

    # --------------------------------------------------------
    # Technical report (auto-populated by wizard from log file)
    # --------------------------------------------------------
    technical_report:
      facility: ""
      sample_prep: ""
      ms_acquisition: ""
      search_engine: ""
      search_parameters: ""
      acknowledgment: ""

    # --------------------------------------------------------
    # AI commentary
    # --------------------------------------------------------
    commentary:
      enabled: true
      backend: "claude-code"
      claude_code_model: "sonnet"
      max_tokens: 1500
      max_retries: 2

# ============================================================
# Global parameters
# ============================================================
params:
  seed: 1
