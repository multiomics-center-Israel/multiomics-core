# ============================================================
# multiomics-core — Proteomics configuration template
# Copy this file and adjust ONLY the fields marked as REQUIRED.
# Do NOT edit R code to start a new project.
# ============================================================

# ============================================================
# Project identity + I/O roots (REQUIRED)
# ============================================================
project:
  dir: "/full-path/to/project_dir"   # REQUIRED: absolute path to the project folder (outside the repo)
  name: "<PROJECT_NAME>"             # REQUIRED: short project identifier
  analysis_round: "A01"              # REQUIRED: analysis iteration / round (e.g., A01, A02...)

# Paths are RELATIVE to project.dir
paths:
  raw: "data"         # where input data lives under project.dir
  out: "outputs"      # where outputs will be written under project.dir

# ============================================================
# Proteomics mode configuration
# ============================================================
modes:
  proteomics:

    # --------------------------------------------------------
    # Data origin / engine
    # --------------------------------------------------------
    engine: "DIANN"          # e.g. DIANN / MaxQuant / FragPipe

    # --------------------------------------------------------
    # Input files (REQUIRED)
    # Paths are RELATIVE to: project.dir / paths.raw
    # --------------------------------------------------------
    files:
      protein:    "proteomics/protein_matrix.csv"
      sample_map: "proteomics/sample_map.csv"
      metadata:   "proteomics/meta_prot.csv"
      contrasts:  "proteomics/contrasts_prot.csv"

    # --------------------------------------------------------
    # Column naming conventions (REQUIRED)
    # --------------------------------------------------------
    id_columns:
      protein_id: "Protein.Group"
      sample_col: "SampleID"

      protein_annot:
        - "Protein.Names"
        - "Genes"
        - "First.Protein.Description"

      map_from: "sample_orig_name"
      map_to:   "SampleID"

    # --------------------------------------------------------
    # Filtering
    # --------------------------------------------------------
    filtering:
      min_count:
        default: 3
        # Optional per-condition override:
        # Control: 3
        # Treatment: 2

    # --------------------------------------------------------
    # Normalization
    # --------------------------------------------------------
    normalization:
      method: "none"      # "none" or "median"

    # --------------------------------------------------------
    # Multiple imputation
    # --------------------------------------------------------
    imputation:
      method: "perseus"    # "none" | "perseus" | "dep2"

      no_repetitions: 10
      min_no_passed: 8

      # Perseus-style parameters
      width: 0.2
      downshift: 1.6

      # DEP2 parameters (future implementation)
      dep2_method: "MinDet"
      dep2_random_seed: 1

    # --------------------------------------------------------
    # Differential expression
    # --------------------------------------------------------
    de:
      method: "limma"
      use_adj_for_pass1: true
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5

    # --------------------------------------------------------
    # How to interpret DE summary tables (used by get_de_features, QC_post, etc.)
    # --------------------------------------------------------
    de_table:
      id_col: "FeatureID"
      pass_any_col: "pass_any_contrast"

    # --------------------------------------------------------
    # QC_post (plots/tables that depend on DE results)
    # --------------------------------------------------------
    qc_post:
      enabled: true
      de_source: "summary"   # "summary" | "table1"
      plots:
        volcano: true
        ma: true
      outputs:
        write_de_tables: true   # writes per-contrast tables derived from the chosen source

    # --------------------------------------------------------
    # Clustering (optional; enable only if you want it)
    # --------------------------------------------------------
    clustering:
      enabled: false

      # Which DE features to cluster.
      # "any_contrast" = pass_any_col == 1
      de_source: "any_contrast"

      # Run steps that require multiple conditions only if enough groups exist
      min_groups: 2

      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"
          k: null

        partition:
          enabled: true
          algorithm: "hclust"   # "kmeans" | "pam" | "hclust"
          distance: "euclidean"
          k: null
          k_max: 20
          nstart: 25
        binary_patterns:
          enabled: true
          corr_cutoff: 0.8
          counts_cutoff: 0
          skip_trivial_patterns: true

      heatmap:
        max_rows: null
        cluster_cols: true

    # --------------------------------------------------------
    # Plotting / QC aesthetics
    # --------------------------------------------------------
    effects:
      color: "Condition"
      shape: null
      samples: "SampleID"

    # --------------------------------------------------------
    # Annotation / Organism
    # --------------------------------------------------------
    annotation:
      organism: "Homo sapiens"      # or "auto", "Mus musculus", etc.
      id_type: "auto"               # "auto" | "symbol" | "uniprot" | "ensembl_peptide"
      skip_annotation: false
      custom_mapping_file: null      # CSV/TSV with protein_id + gene_name columns (for non-model organisms)

    # --------------------------------------------------------
    # QC advanced settings
    # --------------------------------------------------------
    qc:
      run_umap: true
      umap_n_neighbors: 15
      umap_min_dist: 0.1
      outlier_sd_threshold: 3
      min_sample_correlation: 0.8
      top_de_heatmap_sizes: [25, 50, 100]

    # --------------------------------------------------------
    # Pathway enrichment
    # Organism is read from annotation.organism above (single source of truth)
    # --------------------------------------------------------
    pathway:
      enabled: true
      method: "both"          # "fgsea" | "ora" | "both"
      databases: ["GO", "KEGG"]
      gmt_file: null          # Custom GMT file for non-model organisms
      min_size: 10
      max_size: 500

    # --------------------------------------------------------
    # PPI network analysis
    # Species ID is derived from annotation.organism automatically.
    # Override with species: <taxid> only if auto-derivation fails.
    # --------------------------------------------------------
    ppi:
      enabled: true
      # species: 9606         # Derived from annotation.organism; uncomment to override
      significance_threshold: 0.05
      lfc_threshold: 0
      string_score_threshold: 400
      active_subnetwork: true
      complex_analysis: true

    # --------------------------------------------------------
    # Advanced statistics
    # --------------------------------------------------------
    advanced_stats:
      enabled: true
      compute_effect_size_ci: true
      bootstrap_n: 1000
      ci_level: 0.95
      run_robust_regression: false
      run_power_analysis: true
      random_effects: null

    # --------------------------------------------------------
    # Technical report (auto-populated by wizard from log file)
    # --------------------------------------------------------
    technical_report:
      facility: ""
      sample_prep: ""
      ms_acquisition: ""
      search_engine: ""
      search_parameters: ""
      acknowledgment: ""

    # --------------------------------------------------------
    # AI commentary
    # --------------------------------------------------------
    commentary:
      enabled: true
      backend: "claude-code"
      claude_code_model: "sonnet"
      max_tokens: 1500
      max_retries: 2

# ============================================================
# Global parameters
# ============================================================
params:
  seed: 1
