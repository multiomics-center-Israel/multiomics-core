# ============================================================
# multiomics-core — Proteomics configuration template
# Copy this file and adjust ONLY the fields marked as REQUIRED.
# Do NOT edit R code to start a new project.
# ============================================================

# ============================================================
# Project identity + I/O roots (REQUIRED)
# ============================================================
project:
  dir: "/full-path/to/project_dir"   # REQUIRED: absolute path to the project folder (outside the repo)
  name: "<PROJECT_NAME>"             # REQUIRED: short project identifier
  analysis_round: "A01"              # REQUIRED: analysis iteration / round (e.g., A01, A02...)

# Paths are RELATIVE to project.dir
paths:
  raw: "data"         # where input data lives under project.dir
  out: "outputs"      # where outputs will be written under project.dir

# ============================================================
# Proteomics mode configuration
# ============================================================
modes:
  proteomics:

    # --------------------------------------------------------
    # Data origin / engine
    # --------------------------------------------------------
    engine: "DIANN"          # e.g. DIANN / MaxQuant / FragPipe

    # --------------------------------------------------------
    # Input files (REQUIRED)
    # Paths are RELATIVE to: project.dir / paths.raw
    # --------------------------------------------------------
    files:
      protein:    "proteomics/protein_matrix.csv"
      sample_map: "proteomics/sample_map.csv"
      metadata:   "proteomics/meta_prot.csv"
      contrasts:  "proteomics/contrasts_prot.csv"

    # --------------------------------------------------------
    # Column naming conventions (REQUIRED)
    # --------------------------------------------------------
    id_columns:
      protein_id: "Protein.Group"
      sample_col: "SampleID"

      protein_annot:
        - "Protein.Names"
        - "Genes"
        - "First.Protein.Description"

      map_from: "sample_orig_name"
      map_to:   "SampleID"

    # --------------------------------------------------------
    # Filtering
    # --------------------------------------------------------
    filtering:
      min_count:
        default: 3
        # Optional per-condition override:
        # Control: 3
        # Treatment: 2

    # --------------------------------------------------------
    # Normalization
    # --------------------------------------------------------
    normalization:
      method: "none"      # "none" or "median"

    # --------------------------------------------------------
    # Multiple imputation
    # --------------------------------------------------------
    imputation:
      method: "perseus"    # "none" | "perseus"

      no_repetitions: 10
      min_no_passed: 8

      # Perseus-style parameters
      width: 0.2
      downshift: 1.6

    # --------------------------------------------------------
    # Differential expression
    # --------------------------------------------------------
    de:
      method: "limma"
      use_adj_for_pass1: true
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5

    # --------------------------------------------------------
    # How to interpret DE summary tables (used by get_de_features, QC_post, etc.)
    # --------------------------------------------------------
    de_table:
      id_col: "FeatureID"
      pass_any_col: "pass_any_contrast"

    # --------------------------------------------------------
    # QC_post (plots/tables that depend on DE results)
    # --------------------------------------------------------
    qc_post:
      enabled: true
      de_source: "summary"   # "summary" | "table1"
      plots:
        volcano: true
        ma: true
      outputs:
        write_de_tables: true   # writes per-contrast tables derived from the chosen source

    # --------------------------------------------------------
    # Clustering (optional; enable only if you want it)
    # --------------------------------------------------------
    clustering:
      enabled: false

      # Which DE features to cluster.
      # "any_contrast" = pass_any_col == 1
      de_source: "any_contrast"

      # Run steps that require multiple conditions only if enough groups exist
      min_groups: 2

      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"
          k: null

        partition:
          enabled: true
          method: "hclust"     # "kmeans" | "pam" | "hclust"
          distance: "euclidean"
          k: null
          k_max: 20
          nstart: 25
          outputs:
            write_profiles_pdf: true
            write_heatmap_png: true
          use_group_averages: true

        binary_patterns:
          enabled: true
          corr_cutoff: 0.8
          counts_cutoff: 0
          skip_trivial_patterns: true

      heatmap:
        max_rows: null
        cluster_cols: true

    # --------------------------------------------------------
    # Plotting / QC aesthetics
    # --------------------------------------------------------
    effects:
      color: "Condition"
      shape: null
      samples: "SampleID"

# ============================================================
# Global parameters
# ============================================================
params:
  seed: 1
