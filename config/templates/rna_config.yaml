# ============================================================
# multiomics-core — RNA-seq configuration template
# Copy this file and adjust ONLY the fields marked as REQUIRED.
# Do NOT edit R code to start a new project.
# ============================================================

project:
  dir: "/full-path/to/project_dir"   # REQUIRED
  name: "<PROJECT_NAME>"             # REQUIRED
  analysis_round: "A01"              # REQUIRED
  analyst: "Bioinformatics Core"     # Name of the analyst (shown in report header)
  user_notes: ""                     # Optional: free-text project description (appears in report as Project Overview)
  technical_report_file: ""          # Optional: path to facility report (DOCX/PDF/log) for AI-enhanced summary

paths:
  raw: "data"
  out: "outputs"

modes:
  rna:

    # --------------------------------------------------------
    # Input files (REQUIRED)
    # Paths are RELATIVE to: project.dir / paths.raw
    # --------------------------------------------------------
    files:
      counts:     "rna/raw_counts.csv"       # genes x samples
      sample_map: "rna/sample_map.csv"       # raw → unified sample IDs (optional but recommended)
      metadata:   "rna/meta_rna.csv"         # sample-level metadata
      contrasts:  "rna/contrasts_rna.csv"    # optional; can be generated later from metadata
      annotation: ""                          # optional: gene annotation file (e.g., Ensembl BioMart export)
      trinotate:  ""                          # optional: Trinotate annotation report TSV

    # --------------------------------------------------------
    # Annotation processing (optional)
    # Only used if files.annotation is specified
    # --------------------------------------------------------
    annotation:
      source: "Ensembl"   # "Ensembl" | "NCBI_GTF" | "Generic"
      # Column mappings are currently hardcoded per source type.
      # Future: make these config-driven.

    # --------------------------------------------------------
    # Column naming conventions (REQUIRED)
    # --------------------------------------------------------
    id_columns:
      gene_id:    "gene_id"     # column name in counts file (or in separate annotation, if you have one)
      sample_col: "SampleID"    # unified sample ID column in metadata
      map_from:   "sample_original_name"
      map_to:     "SampleID"

    # --------------------------------------------------------
    # Preprocessing
    # --------------------------------------------------------
    normalization:
      method: "TMMlogCPM"   # "TMMlogCPM" | "VST"
      prior.count: 1

    # --------------------------------------------------------
    # Gene filtering: removes lowly expressed genes BEFORE normalization.
    # This is not normalization; it only decides which genes are kept.
    # --------------------------------------------------------
    filtering:
      # mode - how the expression filtering threshold is determined:
      #
      #   "adaptive"    (default, recommended)
      #                 Automatically estimates an expression cutoff from the data
      #                 by looking for a separation between lowly and more highly
      #                 expressed genes. The estimated cutoff is constrained to
      #                 the auto_filter min..max range defined below.
      #                 If no suitable separation is detected, the auto_filter
      #                 fallback threshold is used.
      #                 Review the selected cutoff in:
      #                 <paths.out>/rnaseq/filtering_threshold_qc.png
      #                 (red line = applied cutoff).
      #
      #   "fixed"       Uses the user-defined fixed_threshold.
      #
      #   "deseq2_only" Skips expression-based filtering; removes only genes
      #                 with zero counts across all samples.
      #
      #   "none"        Disables gene filtering and retains all genes.
      #
      # NOTE:
      # Unrecognized mode values currently fall back to "adaptive".
      # Preprocessed input (normalized upstream) bypasses this filtering
      # step regardless of the selected mode.
      #
      mode: "adaptive"

      # Which genes pass ("adaptive" and "fixed"): a gene is kept if, in at least
      # ONE group, at least half of that group's samples (rounded up) are at or
      # above the cutoff. Example: group of 5 samples -> 3 must pass.
      # Set group_col to the metadata column that defines your biological groups,
      # so a gene expressed in only one condition is not thrown away.
      # If omitted: de_table.group_col, then the first effects.color column.
      group_col: "line"

      # Cutoff units: CPM (counts per million) for a count matrix,
      # TPM for tximport (salmon/kallisto) input.

      # Used only when mode: "fixed". Default 1.0, in the units above
      # (1 CPM for a count matrix, 1 TPM for tximport input).
      # fixed_threshold: 1.0

      # Used only when mode: "adaptive":
      auto_filter:
        min: 0.5       # the cutoff is never set lower than this
        max: 2.0       # ...or higher than this
        fallback: 1.0  # used when no dip is found (used as is, not limited to min..max)

    # Optional sample filtering by metadata (if you support it in code)
    # sample_filter:
    #   tissue:
    #     - "leaf"
    #     - "root"

    # --------------------------------------------------------
    # Differential expression
    # Pick the method you implement first; leave defaults conservative.
    # --------------------------------------------------------
    de:
      method: "deseq2"          # "deseq2" | "limma_voom" (example; depends what you implement)
      
      # DESeq2 mode: "default" uses modern DESeq2 defaults (betaPrior=FALSE)
      #              "legacy" uses older behavior (betaPrior=TRUE, modelMatrixType="expanded")
      #              Legacy mode may produce different results (not necessarily better)
      deseq_mode: "default"     # "default" | "legacy"
      
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5
      use_adj: true

    # --------------------------------------------------------
    # Batch in the DE model (optional)
    # Adds batch as a covariate to the DE design:
    #   DESeq2: ~ Batch + <group>    limma: ~ 0 + <group> + Batch
    # The contrasts and their directions are unchanged.
    # Does not modify expression matrices or apply batch correction
    # to QC plots. Downstream analyses that depend on DE results
    # (e.g. DE gene lists used for clustering) may change.
    # Numeric batch labels (e.g. 1, 2, 3) are treated as categories.
    # The run stops if batch and group are fully confounded (e.g. every
    # batch holds a single group) or no residual degrees of freedom remain.
    # Not available with precomputed DE (files$de_table).
    # --------------------------------------------------------
    batch_in_model:
      enabled: false
      # One or two metadata columns holding the batch label(s).
      batch_cols: ["Batch"]

    # --------------------------------------------------------
    # Batch correction for display and clustering (optional)
    # Independent of batch_in_model above: that one changes the DE
    # statistics only, this one changes expression values only, in a
    # separate copy. Either, both or neither can be enabled.
    # --------------------------------------------------------
    batch_correction:
      enabled: false
      # Applied to a continuous log-scale matrix (VST, logCPM, or
      # log-scale preprocessed input), never to raw counts.
      # The corrected matrix is kept separately and is never DE input.
      # Corrected values are for exploratory display and clustering;
      # they do not show that the remaining variation is biological.
      #
      # Metadata column(s) holding the batch label.
      #   limma:  1 or 2 columns
      #   combat: exactly 1 column
      batch_cols: ["Batch"]
      # "limma"  - limma::removeBatchEffect. Shifts each batch's mean.
      #            Recommended for RNA (default).
      # "combat" - sva::ComBat. Also adjusts each batch's spread.
      #            Genes that are constant within a batch are left as
      #            they were; their number is recorded.
      # Both methods are configured to preserve the biological group
      # effect. However, successful separation of biological and batch
      # effects depends on the experimental design and requires
      # validation. The run stops if batch and group are fully confounded.
      method: "limma"
      # ComBat only. true = adjust the batch means only, not the spread.
      # Use when batches are small (e.g. 2 samples per batch).
      combat_mean_only: false

    # How to interpret your DE summary output table (for get_de_features / clustering / QC_post)
    de_table:
      id_col: "FeatureID"
      pass_any_col: "pass_any_contrast"

    # QC_post (if you want the same behavior as proteomics)
    qc_post:
      enabled: true
      de_source: "summary"      # "summary" | "table1" (table1 might not exist for RNA—depends on implementation)
      max_top_de_features: 100  # Max features to show in top DE heatmap (default 100)
      plots:
        volcano: true
        ma: true
      outputs:
        write_de_tables: true

    # Optional clustering (off by default)
    clustering:
      enabled: false
      group_col: "line"             # metadata column for clustering group logic
      de_source: "any_contrast"
      min_groups: 2
      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"
          k: null
        partition:
          enabled: true
          algorithm: "hclust"
          distance: "euclidean"
          k: null
          k_max: 20
          k_method: "silhouette"   # "silhouette" | "gap" — method for automatic K selection.
                                   # If switched to "gap", gap_B defaults to 100 in code
                                   # (see choose_k_gap_statistic in R/core/09_clustering.R).
          nstart: 25
          profile_x_axis_col: null   # Partition cluster PROFILE plot: X-axis metadata column (defaults to group_col); not used for heatmaps
          profile_color_col: null    # Partition cluster PROFILE plot: optional color/linetype grouping column; not used for heatmaps
        binary_patterns:
          enabled: true
          corr_cutoff: 0.8             # Minimum correlation to assign feature to pattern
          counts_cutoff_high: 0        # Minimum counts for "on" (1) positions
          counts_cutoff_low: null      # Maximum counts for "off" (0) positions (null = disabled)
      heatmap:
        max_rows: null
        cluster_cols: true

    # --------------------------------------------------------
    # Plotting / QC aesthetics
    # --------------------------------------------------------
    effects:
      # Color variable for plots
      # Single value (default):
      color: "line"

      # OR multiple values for multiple PCA plots (generates one PCA per color):
      # color:
      #   - "line"
      #   - "time_point"
      #   - "treatment"

      # Shape variable (must be single value if color is an array)
      shape: "labels"

      # Sample identifier column
      samples: "SampleID"

      # Heatmap annotation columns (optional)
      # If not specified, uses color variable only
      # heatmap_annotations:
      #   - "line"
      #   - "time_point"
      #   - "treatment"
      #   - "batch"

    # --------------------------------------------------------
    # Excel export configuration
    # --------------------------------------------------------
    excel:
      # Metadata columns to display as annotation rows above the data table.
      # Set to null to use all metadata columns, or specify a list:
      annotation_rows: null
      # Metadata columns to concatenate for informative sample column headers.
      # Set to null to keep original sample IDs:
      sample_label_cols: null
      # Add per-group CV% columns (CV.<group>) to Final_results_{ALL,DE} for the
      # groups appearing in any contrast. RNA-seq CV is computed on linear CPM
      # (library-size-corrected). Set to false to omit these columns.
      group_cv: true

    # --------------------------------------------------------
    # QC plot generation (threshold-based adaptive plotting)
    # --------------------------------------------------------
    qc:
      # Enable adaptive plot generation based on sample counts
      # If FALSE, all plots are generated (backward compatible behavior)
      # If TRUE or unset, plots adapt based on thresholds below
      adaptive_plots: true  # default: true

      # Thresholds for adaptive decisions (all optional)
      thresholds:
        min_samples_for_pca3d: 10         # Skip 3D PCA below this
        max_samples_for_heatmaps: 120     # Skip distance/corr heatmaps above this
        max_samples_for_expr_heatmap: 60  # Skip expression heatmap above this

      # Expression used by the QC plots: PCA (PC1 vs PC2, PC1 vs PC3, 3D, top-variable),
      # the sample distance/correlation heatmaps and the pre-DE expression heatmaps.
      # With TMMlogCPM they use log2(TMM CPM + cpm_pseudocount), an offset in CPM units;
      # normalization.prior.count is in reads and, at typical depths, a much smaller
      # offset, so genes with a handful of reads would dominate sample-level QC.
      # QC plots only: expr_work and everything that reads it (clustering, post-DE
      # heatmaps, the exported normalized table) keep normalization.prior.count, and DE
      # runs on the counts. Ignored for VST and preprocessed input.
      # Must be above 0; 1 is the usual value (default 1, also when absent).
      cpm_pseudocount: 1

      # Sample correlation/distance heatmap visualization (all optional)
      # These settings improve readability for large sample sets
      heatmap_viz:
        show_sample_labels: false   # Show sample names on axes (default: false to prevent overload)
        cluster_samples: true       # Enable hierarchical clustering (default: true)
        adjust_correlation_scale: false  # Adjust color scale for tight ranges (default: false)

      # To disable adaptive plotting and generate all plots unconditionally:
      #   qc:
      #     adaptive_plots: false

    # --------------------------------------------------------
    # Technical report (auto-populated by wizard from facility report)
    # --------------------------------------------------------
    technical_report:
      facility: ""
      library_prep: ""
      sequencing: ""
      acknowledgment: ""

    # --------------------------------------------------------
    # RNA pathway enrichment analysis (ORA + GSEA)
    # By default (annotation_dir: ""), enrichment uses the online workflow, so a
    # freshly configured project runs without provisioning any annotation tables.
    # To use the faster, reproducible OFFLINE workflow, set annotation_dir to a
    # directory of pre-built local tables (file list below).
    #
    # annotation_dir:
    #   ""   -> existing online enrichment workflow (default).
    #   Path -> offline local annotation tables.
    #
    # Expected files in annotation_dir (GO tables must be pre-expanded):
    #   KEGG_pathway2gene.tab   KEGG_pathway2name.tab
    #   GO2gene_BP.tab          GO2name_BP.tab
    #   GO2gene_MF.tab          GO2name_MF.tab
    #   GO2gene_CC.tab          GO2name_CC.tab
    #
    # Table format (REQUIRED): tab-separated, WITH A HEADER ROW. Only the first
    # two columns are used (column names are free text; the header row is skipped).
    #   *2gene.tab (TERM2GENE): col1 = term ID (GO:...|KEGG path id), col2 = gene ID.
    #   *2name.tab (TERM2NAME): col1 = term ID,                       col2 = term name.
    # A file without a header loses its first data row; a file with <2 columns is
    # skipped with a warning.
    # --------------------------------------------------------
    enrichment:

      # --- Enable / routing ---
      enabled: true
      # Run RNA enrichment.
      # false skips all enrichment analyses while the rest of the RNA pipeline continues.

      annotation_dir: ""
      # Empty ("") -> online workflow (default; nothing to provision).
      # Set to a directory of pre-built local tables to enable offline enrichment,
      # e.g. "data/Func_annot_data_expanded".

      # --- Databases and workers ---
      databases: ["KEGG", "GO_BP", "GO_MF", "GO_CC"]
      # Annotation databases to test. Missing table files are skipped with a warning.

      workers: 1
      # Number of parallel enrichment workers.
      # 1 = sequential execution.

      # --- Statistical settings ---
      pvalue_cutoff: 0.05
      # Significance cutoff for ORA and GSEA (offline enrichment).

      padj_method: "fdr"
      # Multiple-testing adjustment method.

      # gsea_pvalue_cutoff: 0.05
      # Optional GSEA-only significance cutoff (defaults to pvalue_cutoff).
      # It selects what is plotted, counted and kept in the in-memory results;
      # with the fgsea engine each unit's results.csv also holds every tested set.
      # gsea_padj_method: "fdr"
      # Optional GSEA-only adjustment method (defaults to padj_method).
      # clusterProfiler engine only; fgsea reports Benjamini-Hochberg padj.

      gsea_engine: "fgsea"
      # GSEA engine for the offline workflow (annotation_dir set).
      # "fgsea" (default): the same fgsea call as the online workflow and the
      #   proteomics pipeline; gene-set size limits from gsea.min_size/max_size
      #   (default: min 4, no upper limit, as in earlier offline runs),
      #   seeded from params.seed, every tested gene set written to each unit's
      #   results.csv. All four rankings are run and stored alike (no primary).
      # "clusterProfiler": the earlier clusterProfiler::GSEA call (min set size 4,
      #   no upper limit, non-significant sets dropped). Use it to reproduce
      #   offline results produced before the fgsea switch.

      max_terms_in_dotplot: 20
      # Max pathways shown in dotplots/ridgeplots. Display only; all results stay in the tables.

      # --- GO simplification ---
      # GO result simplification is ALWAYS applied in the offline workflow and is
      # NOT configurable: redundant / highly similar GO terms are reduced
      # automatically (KEGG is never simplified). If it cannot run, the unsimplified
      # result is kept with a warning. (A legacy `go_simplify` field is ignored.)

      # --- Plot toggles (each artifact is independently switchable) ---
      plots:
        dotplot: true
        # ORA and GSEA dotplots.

        ridgeplot: true
        # GSEA ridgeplot of leading-edge genes.

        ridgeplot_all_genes: true
        # GSEA ridgeplot using all pathway genes.

        pathway_heatmaps: false
        # Generate per-pathway expression heatmaps.
        # Disabled by default because it creates many files.

        shared_genes: true
        # ORA gene-to-term and term-to-term shared-gene heatmaps.

      # --- GSEA-specific settings ---
      gsea:
        per_pathway_artifacts: true
        # Generate per-pathway GSEA plots and detailed core-gene tables.
        # (Back-compat: the old flat key gsea_per_pathway_artifacts is still honored.)

        # min_size: 4
        # max_size: 500
        # Optional gene-set size limits for fgsea (genes of the set present in the
        # ranking). Unset, they keep the limits of earlier offline runs: min 4 and
        # no upper limit (the number of unique genes in each TERM2GENE table).
        # Offline workflow only (the online workflow uses pathway.min_size/max_size);
        # ignored by gsea_engine "clusterProfiler".

params:
  seed: 1
