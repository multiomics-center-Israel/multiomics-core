# ==============================================================================
# Metabolomics config template (Stages 1 + 2)
# ==============================================================================
# Add this block under modes: in your project config.yaml

project:
  dir: "C:/path/to/your/project"
  name: "MyProject"
  analysis_round: "01"

paths:
  raw: "data"
  out: "outputs"

params:
  seed: 1

modes:
  metabolomics:

    # ---- Input specification ----
    input:
      # "cd_raw"         : Compound Discoverer raw export (Area: columns)
      # "processed_wide" : Already-processed wide table (clean sample columns)
      format: "cd_raw"
      sheet: null          # Excel sheet name/index (optional, for xlsx)

    files:
      data: "metabolomics/cd_export.xlsx"          # REQUIRED
      metadata: "metabolomics/sample_metadata.csv"  # Optional (pipeline infers minimal meta if absent)
      sample_map: null  # Optional: path to CSV/TSV mapping raw column names → unified sample IDs
                        # Columns must match id_columns$map_from and id_columns$map_to below

    # ---- Parsing rules (for cd_raw format) ----
    parsing:
      cd_area_prefix: "Area:"
      # Regex to extract sample_id from CD column names.
      # Default captures: "Area: <SAMPLE_ID>.raw (Fn)"
      # Group 1 = sample_id
      cd_sample_regex: null  # null = use default

    # ---- Feature ID construction & sample mapping ----
    id_columns:
      # If set and exists in data, use this column directly as feature_id
      feature_id_col: null
      # Columns used to construct feature_id when feature_id_col is absent
      name_col: "Name"
      mz_col: "m/z"
      rt_col: "RT [min]"
      # For processed_wide: list annotation columns so sample columns can be
      # identified by exclusion. Not needed if metadata is provided.
      annotation_cols: null
      # Required when files$sample_map is set: column names in the sample_map file
      map_from: null  # e.g. "sample_orig_name"  (raw column name in the data)
      map_to:   null  # e.g. "SampleID"           (unified ID matching metadata)
        # - "Name"
        # - "Formula"
        # - "m/z"
        # - "RT [min]"
        # - "KEGG ID"

    # ---- Preprocessing (missingness, imputation, normalization selection) ----
    # Applied BEFORE normalization. All fields have safe defaults and are consumed
    # by the new met_* targets pipeline. See pipeline DAG documentation for details.
    preprocessing:
      # Missingness filtering thresholds
      feat_missing_threshold: 0.20     # drop features missing in > 20% of samples
      sample_missing_threshold: 0.30   # drop samples missing in > 30% of features
      mnar_threshold: 0.3              # |Spearman corr| threshold for MNAR vs MAR
                                       # (negative corr → MNAR = missing in low-intensity
                                       #  samples → min/2 imputation; else KNN)

      # Imputation
      knn_k: 10                        # k for KNN imputation of MAR features
      epsilon: 1.0e-8                  # near-zero guard for imputed values

      # Two-pass normalization review workflow:
      #   null  — review mode (pass 1): run QC suite + summary report, then stop.
      #           Review qc/normalization_review_report.html, then set chosen_norm.
      #   "pqn" — full pipeline (pass 2): skip QC layer, run analysis + report.
      # Valid values: null | "tss" | "median" | "pqn"
      chosen_norm: null

      # LOESS drift correction — only activates when BOTH metadata columns exist
      # AND there are >= 4 QC samples (is_QC == TRUE) with no NA injection_order.
      # If preconditions are absent, met_corrected silently returns chosen_norm
      # unchanged (no error, no NULL target).
      drift_correction:
        enabled: true
        injection_order_col: "injection_order"  # numeric column in sample metadata
        qc_flag_col: "is_QC"                    # logical column in sample metadata
        loess_span: 0.75
        epsilon: 1.0e-8

    # ---- Normalization ----
    normalization:
      # Set to true if the input file is already biologically normalized.
      # When true, sample_norm defaults to "none" (no double-normalization).
      # Transformation and scaling are still applied if configured.
      input_already_normalized: false

      # 1. Sample normalization (LEGACY single-step pipeline only).
      # In the new preprocessing pipeline, normalization method is selected via
      # preprocessing.chosen_norm; TSS / Median / PQN targets always run in parallel.
      # "none" | "sum" | "median" | "pqn" | "is"
      sample_norm: "pqn"

      # 2. Transformation: "none" | "log2" | "log10"
      # Used by the met_log target (new pipeline) and the legacy path.
      transform: "log2"

      # 3. Scaling: "none" | "auto" | "pareto" | "range"
      # NOTE: Not applied in the new preprocessing pipeline. Sample normalization
      # (TSS / Median / PQN) replaces the scaling step for expr_work.
      # Still consumed by the legacy preprocess_metabolomics() code path.
      scaling: "none"

      # Pseudocount added before log transform (default 1).
      # Consumed by the met_log target in the new pipeline.
      pseudocount: 1

      # How to handle NA values before normalization (LEGACY path only).
      # With the new preprocessing block active, MNAR/MAR imputation handles
      # missingness upstream — keep "keep" here to avoid double-imputation.
      #   "keep"     (default) — pass NAs through; norm functions use na.rm=TRUE
      #   "zero"     — replace NA with 0 (treat as below-detection)
      #   "min_half" — replace NA with per-feature min/2
      #   "lod"      — replace NA with fraction of per-feature minimum
      na_policy: "keep"

      # Column in row_data marking internal standard (only if sample_norm = "is")
      is_ref_col: null

    # ---- Sample filtering (optional) ----
    sample_filter:
      enabled: false
      rules:
        exclude_blanks: true
        exclude_qc: false
        exclude_samples: null  # list of sample IDs to exclude

    # ---- Effects (for QC plots) ----
    effects:
      # Column in metadata used as sample identifier
      samples: "sample_id"
      # Column(s) for PCA coloring (single string or list for multi-color)
      color: "sample_type"
      # Column for PCA shape aesthetic (optional)
      shape: null
      # Columns to show as heatmap annotations (optional list)
      heatmap_annotations: null
        # - "Treatment"
        # - "TimePoint"

    # ---- QC suite settings ----
    # Controls the intermediate QC diagnostic targets:
    #   met_log_qc, met_norm_tss_qc, met_norm_median_qc, met_norm_pqn_qc,
    #   met_qc_comparison
    # These are leaf nodes — a failure here never blocks analysis targets.
    qc:
      enabled: true

      # Column in sample metadata used to identify QC samples.
      # If the column holds logical values (TRUE/FALSE), boolean detection is used.
      # If the column holds character values, set qc_flag_value to the QC label.
      qc_flag_column: "treatment"
      qc_flag_value: "qc"   # case-insensitive; also matches "TRUE" / "1" columns

      # Per-plot toggles (set any to false to skip that plot type at every stage)
      plots:
        pca: true
        density: true
        boxplot: true
        rle: true
        histogram: true           # skipped automatically when groups < 2 or > 8
        heatmap_expression: true
        heatmap_correlation: true
        heatmap_distance: true

      thresholds:
        min_samples_for_pca: 3         # minimum samples required to run PCA
        max_samples_for_heatmaps: 120  # skip all heatmaps above this sample count
        top_variable_features: 100     # features selected by row-variance for expression heatmap

    # ==================================================================
    # Stage 2: Differential expression, feature selection, enrichment
    # ==================================================================

    # ---- Differential expression ----
    de:
      # Method: "limma" | "t_test" | "wilcoxon"
      method: "limma"

      # Column in metadata defining experimental groups
      condition_column: "treatment"

      # Contrasts: list of "numerator - denominator" strings
      contrasts:
        - "treated - control"

      # Significance thresholds
      p_cutoff: 0.05              # adjusted p-value cutoff
      pval_cutoff: 0.05           # raw p-value for horizontal line on volcano
      linear_fc_cutoff: 1.5       # linear FC cutoff (log2FC = log2(1.5) ~ 0.585)

      # Set to true to skip DE entirely
      # skip: false

    # ---- Random forest feature importance (optional) ----
    rf:
      run_rf: true
      n_trees: 500
      importance: "permutation"    # "permutation" | "impurity"
      top_n: 20                    # features to display in bar plot
      seed: 1234
      # condition_column: "treatment"  # defaults to de$condition_column

    # ---- PLS-DA multivariate analysis (optional) ----
    plsda:
      run_plsda: true
      vip_top_n: 15               # top VIP features to display
      colors: null                # null = use default palette
      # condition_column: "treatment"  # defaults to de$condition_column

    # ---- Pathway enrichment (optional) ----
    # Four methods are available (each runs independently):
    #   QEA    — globaltest: quantitative enrichment on raw expression
    #   ssGSEA — GSVA + Wilcoxon: single-sample enrichment scores
    #   ORA    — Fisher's exact test: significant features (fg) vs all (bg)
    #   GSEA   — fgsea: ranked by log2FC from DE results
    # ORA and GSEA require DE results; QEA and ssGSEA do not.
    enrichment:
      run_enrichment: false        # set to true to enable

      # Library names are derived from GMT file basenames.
      # Leave empty to use only gmt_file entries below.
      libraries: []

      # GMT files (used by all four methods):
      gmt_file: null
        # - "path/to/custom_pathways.gmt"

      # Optional HMDB-to-KEGG mapping file (TSV with HMDB and KEGG columns)
      mapping_file: null

      # Condition column for Wilcoxon test in ssGSEA
      # condition_column: "treatment"  # defaults to de$condition_column


# ==============================================================================
# Example: "multi_level" batch input (one xlsx per detection level in a dir)
# ==============================================================================
# Use this when your experiment produces one Compound Discoverer export per
# detection level (e.g., Level_1.xlsx, Level_2.xlsx, Level_3.xlsx) all placed
# in a single directory.  The pipeline merges them into a single expr_raw matrix
# (features × samples) whose structure is identical to the single-file path.
#
# Key constraints:
#   - files$data must NOT be set (mutually exclusive with files$data_dir)
#   - All level files must contain the same sample set (error otherwise)
#   - Source_File column is injected into row_data automatically
#   - Feature IDs are prefixed: "Level_1__Glucose_mz180.0634_rt1.23"
#   - feature_id_orig retains the pre-prefix ID for traceability
#
# modes:
#   metabolomics:
#     input:
#       format: "multi_level"
#       level_format: "cd_raw"          # per-file parser: "cd_raw" | "processed_wide"
#       level_pattern: "\\.xlsx$"       # regex to select files in data_dir
#       sheet: null                     # Excel sheet (shared across all level files)
#     files:
#       data_dir: "metabolomics/levels/"    # directory; replaces files$data
#       metadata: "metabolomics/meta.csv"   # same optional metadata as single-file path
#     parsing:
#       cd_area_prefix: "Area:"             # shared across all level files
#       cd_sample_regex: null
#     id_columns:
#       feature_id_col: null
#       name_col: "Name"
#       mz_col: "m/z"                   # rounded to 4 d.p. in feature ID construction
#       rt_col: "RT [min]"              # rounded to 2 d.p. in feature ID construction
#     preprocessing:
#       chosen_norm: "pqn"
#     effects:
#       samples: "sample_id"
#       color: "treatment"


