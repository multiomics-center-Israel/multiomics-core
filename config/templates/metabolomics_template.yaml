# ==============================================================================
# Metabolomics config (multi-level / processed_wide compatible)
# ==============================================================================

project:
  dir: "/full-path/to/project_dir"   # REQUIRED: absolute path to the project folder (outside the repo)
  name: "<PROJECT_NAME>"             # REQUIRED: short project identifier
  analysis_round: "A01"              # REQUIRED: analysis iteration / round (e.g., A01, A02...)

paths:
  raw: "data"
  out: "outputs"

# ---- Global parameters ----
params:
  seed: 1  # global seed for reproducibility (KNN imputation, clustering, etc.)

modes:
  metabolomics:

    # ---- Input specification ----
    input:
      # "cd_raw" | "processed_wide" | "multi_level"
      format: "processed_wide"

      # For multi_level only:
      level_format: "processed_wide"
      level_pattern: "\\.xlsx$"

      # Excel sheet name (optional)
      sheet: null

    files:
      # data OR data_dir (mutually exclusive)
      data: "metabolics/intesities.tsv"
      # data_dir: "metabolics/dir_name"

      metadata: "metabolics/metadata.txt"
      # sample_map: "metabolics/sample_map.txt"
      contrasts: "metabolics/contrasts.txt"

    # ---- Parsing rules ----
    parsing:
      cd_area_prefix: "Area:"
      cd_sample_regex: null  # null = use default

    # ---- Feature ID + sample mapping ----
    id_columns:
      name_col: "feature_id"
      mz_col: "m/z"
      rt_col: "RT [min]"

      # Used only if sample_map is provided
      map_from: "origin_id"
      map_to: "SampleID"

    # ==============================================================================
    # Stage 1: Preprocessing (missingness + imputation + normalization selection)
    # ==============================================================================
    preprocessing:

      # ---- Missingness filtering ----
      feat_missing_threshold: 0.20
      sample_missing_threshold: 0.30

      # MNAR vs MAR classification (Spearman correlation)
      mnar_threshold: 0.3

      # ---- Imputation ----
      knn_k: 10
      epsilon: 1.0e-8

      # ---- Normalization selection workflow ----
      # null  → QC review mode (compute all methods, stop after report)
      # "tss" | "median" | "pqn" → full pipeline
      chosen_norm: null

      # ---- Drift correction (LOESS) ----
      drift_correction:
        enabled: false
        injection_order_col: "injection_order"
        qc_flag_col: "is_QC"
        loess_span: 0.75
        epsilon: 1.0e-8

    # ==============================================================================
    # Normalization & scaling (interpretation layer)
    # ==============================================================================
    normalization:

      # ---- Input state ----
      input_already_normalized: false
      # If TRUE → skip sample_norm but still allow transform/scaling

      # ---- Sample normalization (legacy / reference only) ----
      # NOTE:
      # In the new pipeline, ALL methods run in parallel:
      #   - TSS (total sum scaling)
      #   - Median normalization (log shift)
      #   - PQN
      # chosen_norm (above) decides which one is used downstream
      sample_norm: "pqn"

      # ---- Transformation ----
      # Applied in mod_met_log OR inside normalization branches
      transform: "log2"

      # ---- Scaling ----
      # IMPORTANT:
      # Currently NOT applied in preprocessing pipeline.
      # Intended for:
      #   - QC / reporting layer
      #   - downstream modeling (future)
      #
      # Options: "none" | "auto" | "pareto" | "range"
      scaling: "pareto"

      # ---- Log pseudocount ----
      pseudocount: 1

      # ---- NA policy (legacy only) ----
      # New pipeline handles missingness BEFORE normalization
      na_policy: "keep"

      # Internal standard column (if using IS normalization)
      is_ref_col: null

    # ==============================================================================
    # Sample filtering (applied early, in mod_met_raw)
    # ==============================================================================
    sample_filter:
      enabled: false
      rules:
        exclude_blanks: true
        exclude_qc: false
        exclude_samples: null

    # ==============================================================================
    # QC / visualization settings
    # ==============================================================================
    effects:
      samples: "SampleID"
      color: "treatment"
      shape: "time"
      heatmap_annotations: "group"

    # --------------------------------------------------------
    # Excel export configuration
    # --------------------------------------------------------
    excel:
      # Metadata columns to display as annotation rows above the data table.
      # Set to null to use all metadata columns, or specify a list:
      annotation_rows: null
      # Metadata columns to concatenate for informative sample column headers.
      # Set to null to keep original sample IDs:
      sample_label_cols: null

    qc:
      enabled: true

      # Used for QC-specific plots (e.g., drift, QC clustering)
      qc_flag_column: "treatment"

      # Set true to generate the binary missingness heatmap (diagnostic_plots/)
      missingness_heatmap: false

      thresholds:
        min_samples_for_pca3d: 4
        max_samples_for_heatmaps: 120

    # ==============================================================================
    # Stage 2: Downstream analysis
    # ==============================================================================

    # ---- Differential expression ----
    de:
      method: "limma"
      condition_column: "group"

      p_cutoff: 0.05
      pval_cutoff: 0.05
      linear_fc_cutoff: 1.5
      robust_ebayes: true

    # ---- Clustering ----
    clustering:
      enabled: true
      group_col: "group"
      min_groups: 2
      de_source: "any_contrast"

      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"

        partition:
          enabled: true
          algorithm: "hclust"
          distance: "euclidean"
          k_max: 20
          nstart: 25
          x_axis_col: null           # Metadata column for profile plot X-axis (defaults to group_col)
          color_col: null            # Optional metadata column for color/linetype grouping in profile plots

        binary_patterns:
          enabled: true
          corr_cutoff: 0.8

      heatmap:
        max_rows: null
        cluster_cols: true

    # ---- Enrichment ----
    enrichment:
      run_enrichment: false
      libraries: []
      gmt_file: null
      mapping_file: null
