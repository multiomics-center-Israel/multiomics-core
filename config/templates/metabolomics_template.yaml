# ==============================================================================
# Metabolomics config (multi-level / processed_wide compatible)
# ==============================================================================

project:
  dir: "/full-path/to/project_dir"   # REQUIRED: absolute path to the project folder (outside the repo)
  name: "<PROJECT_NAME>"             # REQUIRED: short project identifier
  analysis_round: "A01"              # REQUIRED: analysis iteration / round (e.g., A01, A02...)

paths:
  raw: "data"
  out: "outputs"

# ---- Global parameters ----
params:
  seed: 1  # global seed for reproducibility (KNN imputation, clustering, etc.)

modes:
  metabolomics:

    # ---- Input specification ----
    input:
      # "cd_raw" | "processed_wide" | "multi_level"
      format: "processed_wide"

      # For multi_level only:
      level_format: "processed_wide"
      level_pattern: "\\.xlsx$"

      # Excel sheet name (optional)
      sheet: null

    files:
      # data OR data_dir (mutually exclusive)
      data: "metabolics/intesities.tsv"
      # data_dir: "metabolics/dir_name"

      metadata: "metabolics/metadata.txt"
      # sample_map: "metabolics/sample_map.txt"
      contrasts: "metabolics/contrasts.txt"

    # ---- Parsing rules ----
    parsing:
      cd_area_prefix: "Area:"
      cd_sample_regex: null  # null = use default

    # ---- Feature ID + sample mapping ----
    id_columns:
      name_col: "feature_id" # The original feature or name id that was delivered by the researcher (e.g: NameID/Name/...)
      mz_col: "m/z"
      rt_col: "RT [min]"

      # Used only if sample_map is provided
      map_from: "origin_id"
      map_to: "SampleID"

    # ==============================================================================
    # Stage 1: Preprocessing (missingness + imputation + normalization selection)
    # ==============================================================================
    preprocessing:

      # ---- Missingness filtering (soft defaults) ----
      # feat_missing_threshold:   drop a metabolite if it is missing in more
      #                           than this fraction of samples (0.50 = drop
      #                           only metabolites missing in >50% of samples).
      # sample_missing_threshold: drop a sample if it is missing more than
      #                           this fraction of metabolites. Set to 1.0 to
      #                           disable sample filtering entirely.
      feat_missing_threshold: 0.50
      sample_missing_threshold: 1.0

      # ---- Normalization selection workflow ----
      # null  → QC review mode (compute all methods, stop after report)
      # "none" | "tss" | "median" | "pqn" | "eigenms" | "eigenms_forced" |
      #   "bio_factor"  → full pipeline
      #
      # "none": skip sample normalization — use when the input table is already
      # normalized upstream. transform/scaling below still apply, so log2 is
      # still taken; if the table also arrives log-scaled, set transform: "none".
      chosen_norm: null

      # ---- Biological-factor normalization (chosen_norm: "bio_factor") ----
      # Divide each sample by a measured per-sample covariate (e.g. total
      # protein) before log2. Names the metadata column holding that value;
      # required only when chosen_norm = "bio_factor".
      #
      # When to prefer it: use when a measured input amount (total protein,
      # cell count, tissue mass) is the correct scaling variable and you trust
      # the assay. Unlike tss/median/pqn, bio_factor corrects ONLY for this one
      # covariate — it does not account for compositional or dilution effects
      # beyond it, so it assumes the covariate captures the dominant source of
      # between-sample loading differences. Note also that the normalization is
      # only as good as the measurement: a noisy covariate propagates directly
      # into the normalized intensities.
      biological_factor_col: null

      # ---- Sample normalization (legacy / reference only) ----
      # All methods (tss, median, pqn, eigenms) run in parallel; the ACTIVE
      # choice is controlled by chosen_norm above, not by this field.
      sample_norm: "pqn"

      # ---- Transformation (applied inside the normalization branches) ----
      transform: "log2"

      # ---- Feature scaling ----
      # IMPORTANT: scaling must NOT be applied before differential analysis for
      # metabolomics. Clustering and PCA use a built-in z-score that does NOT
      # read this key, so leave "none" unless you specifically want the chosen
      # matrix scaled for feature-selection workflows.
      # Options: "none" | "center" | "auto" | "pareto" | "range"
      scaling: "none"

      # ---- Log pseudocount ----
      pseudocount: 1

      # ---- Drift correction (LOESS) ----
      drift_correction:
        enabled: false
        injection_order_col: "injection_order"
        qc_flag_col: "is_QC"
        loess_span: 0.75
        epsilon: 1.0e-8

    # ==============================================================================
    # Sample filtering (applied early, in mod_met_raw)
    # ==============================================================================
    sample_filter:
      enabled: false
      rules:
        exclude_blanks: true
        exclude_qc: false
        exclude_samples: null

    # ==============================================================================
    # QC / visualization settings
    # ==============================================================================
    effects:
      samples: "SampleID"
      color: "treatment"
      shape: "time"
      # Metadata column(s) drawn as annotation bars on the QC heatmaps. Accepts a
      # single column or a YAML list (e.g. [group, time]) for multiple bars; values
      # not found in the metadata are skipped, and if unset it falls back to the
      # primary color variable (effects.color). "group" here is the single-column option.
      heatmap_annotations: "group"  # [group, time]

    # --------------------------------------------------------
    # Excel export configuration
    # --------------------------------------------------------
    excel:
      # Metadata columns to display as annotation rows above the data table.
      # Set to null to use all metadata columns, or specify a list:
      annotation_rows: null
      # Metadata columns to concatenate for informative sample column headers.
      # Set to null to keep original sample IDs:
      sample_label_cols: null
      # Add per-group CV% columns (CV.<group>) to Final_results_{ALL,DE} for the
      # groups appearing in any contrast. Metabolomics CV is computed on the
      # post-normalization linear matrix (2^expr_work - pseudocount), keeping it
      # comparable to the RNA-seq/proteomics CV. NOTE: if feature scaling is
      # enabled (preprocessing.scaling != "none"), this back-transform is invalid
      # and CV falls back to the PRE-normalization matrix, which then includes
      # technical variation. Set to false to omit these columns.
      group_cv: true

    qc:
      enabled: true

      # Used for QC-specific plots (e.g., drift, QC clustering), (refer to the pooled or qc samples)
      qc_flag_column: "treatment"

      thresholds:
        max_samples_for_heatmaps: 120

    # ==============================================================================
    # Stage 2: Downstream analysis
    # ==============================================================================

    # ---- Differential expression ----
    de:
      method: "limma"
      condition_column: "group"

      p_cutoff: 0.05
      # true (default) = gate significance on BH-adjusted p (padj);
      # false = raw p-value
      use_adjusted_pval: true
      linear_fc_cutoff: 1.5

    # ---- Clustering ----
    clustering:
      enabled: true
      group_col: "group"
      min_groups: 2

      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"

        partition:
          enabled: true
          algorithm: "hclust"
          distance: "euclidean"
          k_max: 20
          nstart: 25
          # Only relevant in partition clustering to generate profile plots
          profile_x_axis_col: null   # Partition cluster PROFILE plot: X-axis metadata column (defaults to group_col); not used for heatmaps
          profile_color_col: null    # Partition cluster PROFILE plot: optional color/linetype grouping column; not used for heatmaps

        binary_patterns:
          enabled: true
          corr_cutoff: 0.8

      heatmap:
        max_rows: null
        cluster_cols: true

    # ---- Enrichment ----
    enrichment:
      run_enrichment: false
      # Build the DE-metabolite KEGG network step (writes the report "Network/"
      # HTML). Off by default; set true to build it.
      run_network: false
      libraries: []
      gmt_file: null
      mapping_file: null
      # Which p-value column to use when filtering significant features for ORA:
      #   "P.Value"   - raw p-value (default; MetaboAnalyst convention)
      #   "adj.P.Val" - BH-adjusted (FDR-controlled, more conservative)
      pvalue_column: "P.Value"

      # Mummichog m/z-based pathway analysis — isolated, version-pinned engine
      # (mummichog==2.7.0 via processx). Opt-in; runs on the built-in human_mfn
      # model by default. Requires the pinned venv: `make mummichog-venv` then
      # `export MUMMICHOG_PYTHON="$(pwd)/envs/mummichog/bin/python"`.
      mummichog:
        enabled: false
        p_cutoff: 0.05
        n_permutations: 100
        tolerance_ppm: 10
        ionization_mode: pos_default   # pos_default | positive | negative

        # Force primary ion (mummichog's -z). mummichog 2.7.0 REQUIRES a primary
        # ion (M+H[+] / M-H[-]) to be present before accepting a metabolite
        # prediction, which reduces noise from irrelevant adducts — this is the
        # engine's default. Set false to allow non-primary adducts (emits
        # `-z False`). Omit to keep the default. Maps to MetaboAnalyst's
        # force_primary_ion option.
        force_primary_ion: true

        # Metabolic model (precedence: model_ref > model_json > built-in human).
        # The built-in model is HUMAN ONLY: a non-human `organism` (above) with
        # no custom model is refused, not silently run against human pathways.
        #
        #   model_ref  a published model fetched by URL and verified against its
        #              sha256, then cached under envs/mummichog-models/<sha256>.json.
        #              Preferred for organism-specific models (e.g. cre_kegg_*).
        #   model_json a path to a local model JSON on this machine.
        #
        # model_ref:
        #   url: https://github.com/multiomics-center-Israel/multiomics-annotation-prep/releases/download/cre_kegg_20260711/cre_kegg_20260711.json
        #   sha256: c403c96fbec8df9ae34b828fec01270c8ea3940acc36e4e5ff770868dc8b912b
        # model_json: /path/to/local/model.json
