# ==============================================================================
# Metabolomics config template (Stages 1 + 2)
# ==============================================================================
# Add this block under modes: in your project config.yaml

project:
  dir: "C:/path/to/your/project"
  name: "MyProject"
  analysis_round: "01"

paths:
  raw: "data"
  out: "outputs"

params:
  seed: 1

modes:
  metabolomics:

    # ---- Input specification ----
    input:
      # "cd_raw"         : Compound Discoverer raw export (Area: columns)
      # "processed_wide" : Already-processed wide table (clean sample columns)
      format: "cd_raw"
      sheet: null          # Excel sheet name/index (optional, for xlsx)

    files:
      data: "metabolomics/cd_export.xlsx"          # REQUIRED
      metadata: "metabolomics/sample_metadata.csv"  # Optional (pipeline infers minimal meta if absent)

    # ---- Parsing rules (for cd_raw format) ----
    parsing:
      cd_area_prefix: "Area:"
      # Regex to extract sample_id from CD column names.
      # Default captures: "Area: <SAMPLE_ID>.raw (Fn)"
      # Group 1 = sample_id
      cd_sample_regex: null  # null = use default

    # ---- Feature ID construction ----
    id_columns:
      # If set and exists in data, use this column directly as feature_id
      feature_id_col: null
      # Columns used to construct feature_id when feature_id_col is absent
      name_col: "Name"
      mz_col: "m/z"
      rt_col: "RT [min]"
      # For processed_wide: list annotation columns so sample columns can be
      # identified by exclusion. Not needed if metadata is provided.
      annotation_cols: null
        # - "Name"
        # - "Formula"
        # - "m/z"
        # - "RT [min]"
        # - "KEGG ID"

    # ---- Normalization ----
    normalization:
      # Set to true if the input file is already biologically normalized.
      # When true, sample_norm defaults to "none" (no double-normalization).
      # Transformation and scaling are still applied if configured.
      input_already_normalized: false

      # 1. Sample normalization: "none" | "sum" | "median" | "pqn" | "is"
      sample_norm: "pqn"

      # 2. Transformation: "none" | "log2" | "log10"
      transform: "log2"

      # 3. Scaling: "none" | "auto" | "pareto" | "range"
      scaling: "none"

      # Pseudocount added before log transform (default 1)
      pseudocount: 1

      # How to handle NA values before normalization:
      #   "keep"  (default) — pass NAs through; norm functions use na.rm=TRUE
      #   "zero"  — replace NA with 0 (treat as below-detection)
      # expr_filt is never modified; only the working copy (expr_for_norm) is affected.
      na_policy: "keep"

      # Column in row_data marking internal standard (only if sample_norm = "is")
      is_ref_col: null

      # ---- Method evaluation (optional) ----
      # List of method combos to compare. Each entry must have:
      #   sample_norm, transform, scaling
      # Pipeline will produce a comparison table with QC metrics.
      evaluate_methods:
        - sample_norm: "none"
          transform: "log2"
          scaling: "none"
        - sample_norm: "pqn"
          transform: "log2"
          scaling: "none"
        - sample_norm: "pqn"
          transform: "log2"
          scaling: "pareto"
        - sample_norm: "median"
          transform: "log2"
          scaling: "auto"

    # ---- Sample filtering (optional) ----
    sample_filter:
      enabled: false
      rules:
        exclude_blanks: true
        exclude_qc: false
        exclude_samples: null  # list of sample IDs to exclude

    # ---- Effects (for QC plots) ----
    effects:
      # Column in metadata used as sample identifier
      samples: "sample_id"
      # Column(s) for PCA coloring (single string or list for multi-color)
      color: "sample_type"
      # Column for PCA shape aesthetic (optional)
      shape: null
      # Columns to show as heatmap annotations (optional list)
      heatmap_annotations: null
        # - "Treatment"
        # - "TimePoint"

    # ---- QC plot settings ----
    qc:
      adaptive_plots: true
      thresholds:
        min_samples_for_pca3d: 10
        max_samples_for_heatmaps: 120

    # ==================================================================
    # Stage 2: Differential expression, feature selection, enrichment
    # ==================================================================

    # ---- Differential expression ----
    de:
      # Method: "limma" | "t_test" | "wilcoxon"
      method: "limma"

      # Column in metadata defining experimental groups
      condition_column: "treatment"

      # Contrasts: list of "numerator - denominator" strings
      contrasts:
        - "treated - control"

      # Significance thresholds
      p_cutoff: 0.05              # adjusted p-value cutoff
      pval_cutoff: 0.05           # raw p-value for horizontal line on volcano
      linear_fc_cutoff: 1.5       # linear FC cutoff (log2FC = log2(1.5) ~ 0.585)

      # Set to true to skip DE entirely
      # skip: false

    # ---- Random forest feature importance (optional) ----
    rf:
      run_rf: true
      n_trees: 500
      importance: "permutation"    # "permutation" | "impurity"
      top_n: 20                    # features to display in bar plot
      seed: 1234
      # condition_column: "treatment"  # defaults to de$condition_column

    # ---- PLS-DA multivariate analysis (optional) ----
    plsda:
      run_plsda: true
      vip_top_n: 15               # top VIP features to display
      colors: null                # null = use default palette
      # condition_column: "treatment"  # defaults to de$condition_column

    # ---- Pathway enrichment (optional) ----
    # Four methods are available (each runs independently):
    #   QEA    — globaltest: quantitative enrichment on raw expression
    #   ssGSEA — GSVA + Wilcoxon: single-sample enrichment scores
    #   ORA    — Fisher's exact test: significant features (fg) vs all (bg)
    #   GSEA   — fgsea: ranked by log2FC from DE results
    # ORA and GSEA require DE results; QEA and ssGSEA do not.
    enrichment:
      run_enrichment: false        # set to true to enable

      # Library names are derived from GMT file basenames.
      # Leave empty to use only gmt_file entries below.
      libraries: []

      # GMT files (used by all four methods):
      gmt_file: null
        # - "path/to/custom_pathways.gmt"

      # Optional HMDB-to-KEGG mapping file (TSV with HMDB and KEGG columns)
      mapping_file: null

      # Condition column for Wilcoxon test in ssGSEA
      # condition_column: "treatment"  # defaults to de$condition_column


