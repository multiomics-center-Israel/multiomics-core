# ==============================================================================
# Lipidomics example config (runnable against bundled synthetic data)
# ==============================================================================
# This config runs the lipidomics pipeline end-to-end against the synthetic
# dataset shipped at data/example_lipidomics/lipidomics/ (8 samples,
# Treatment vs Control, ~120 lipid species, translated_csv format).
#
# To use:
#   1. Set project.dir below to your local checkout of multiomics-core.
#   2. From the project root:
#        Rscript run.R --config config/templates/lipidomics_example.yaml
#
# The dataset is regenerated by
#   data/example_lipidomics/lipidomics/generate_example.R

project:
  dir: "/path/to/multiomics-core"      # absolute path to repo checkout
  name: "Lipidomics_Example"
  analysis_round: "01"
  analyst: "example"

paths:
  raw: "data"
  out: "outputs"

params:
  seed: 1

modes:
  lipidomics:

    # ---- Input specification ----
    input:
      # "lipidsearch"    : LipidSearch export (Excel or CSV with annotation columns)
      # "translated_csv" : Translated CSV (Metabolite col + sample cols, optional Label row)
      # "processed_wide" : Already-processed wide table (clean sample columns)
      format: "translated_csv"
      has_group_row: true       # Row 1 = Label row with Control/Treatment

    files:
      data: "example_lipidomics/lipidomics/data.csv"          # REQUIRED
      metadata: "example_lipidomics/lipidomics/metadata.csv"  # Optional

    # ---- Feature ID construction ----
    id_columns:
      feature_id_col: null
      name_col: "Metabolite"

    # ---- Normalization ----
    normalization:
      input_already_normalized: false

      # 1. Sample normalization: "none" | "sum" | "median" | "pqn" | "eigenms" | "is"
      sample_norm: "pqn"

      # 2. Transformation: "none" | "log2" | "log10" | "glog10"
      transform: "log2"

      # 3. Scaling: "none" | "center" | "auto" | "pareto" | "range"
      scaling: "pareto"

      pseudocount: 1

      # Missing value handling: "keep" | "zero" | "min_half" | "lod"
      na_policy: "min_half"
      na_lod_fraction: 0.2

      is_ref_col: null
      biological_factor_col: null

      # ---- Method evaluation (optional) ----
      # Each entry is run through apply_normalization_pipeline() and reported
      # in lipidomics/datasets/normalization_method_comparison.tsv
      # (median RSD + PC1 variance per method).
      evaluate_methods:
        - sample_norm: "none"
          transform: "log2"
          scaling: "none"
        - sample_norm: "sum"
          transform: "log2"
          scaling: "auto"
        - sample_norm: "pqn"
          transform: "log2"
          scaling: "pareto"

    # ---- Feature filtering (optional) ----
    feature_filter:
      enabled: true
      max_group_missing_frac: 0.30

    # ---- Sample filtering (optional) ----
    sample_filter:
      enabled: true
      rules:
        exclude_blanks: true
        exclude_qc: false
        exclude_pools: true
        exclude_samples: null
      exclude_patterns:
        - "^Pool"
        - "^Procedure_Blank"
        - "^Blank"

    # ---- Effects (for QC plots) ----
    effects:
      samples: "sample_id"
      color: "condition"
      shape: null
      heatmap_annotations:
        - "condition"

    # ---- QC settings ----
    qc:
      adaptive_plots: true
      thresholds:
        min_samples_for_pca3d: 10
        max_samples_for_heatmaps: 120

    # ---- Differential expression ----
    de:
      method: "limma"
      condition_column: "condition"
      contrasts:
        - "Treatment - Control"
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5

    # ---- Clustering ----
    clustering:
      enabled: true
      group_col: "condition"
      min_groups: 2
      de_source: "any_contrast"

      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"

        partition:
          enabled: true
          algorithm: "hclust"
          distance: "euclidean"
          k_max: 20
          nstart: 25

        binary_patterns:
          enabled: true
          corr_cutoff: 0.8

      heatmap:
        max_rows: null
        cluster_cols: true

    # ---- Random forest (optional) ----
    rf:
      run_rf: true
      n_trees: 500
      importance: "permutation"
      top_n: 20
      seed: 1234

    # ---- PLS-DA (optional) ----
    plsda:
      run_plsda: true
      vip_top_n: 15
      colors: null

    pathway:
      enabled: true
      organism: "Homo sapiens"
      p_threshold: 0.05
      string_network: true
      string_organism: 9606
      string_score: 400

    # ---- AI / data-driven commentary ----
    commentary:
      enabled: no
      backend: "none"
      claude_model: claude-sonnet-4-5-20250929
      openai_model: gpt-4o
      max_tokens: 1500
      max_retries: 2
      retry_delay: 5
