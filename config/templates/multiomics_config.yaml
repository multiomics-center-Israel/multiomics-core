# ==============================================================================
# Multi-Omics Integration Config Template
# ==============================================================================
# This template shows how to configure multi-omics integration analysis.
# Prerequisites: Individual omics pipelines (rna, proteomics, metabolomics)
# must be configured and will run first to generate preprocessed data.

project:
  dir: "/path/to/project"
  name: "MultiOmics_Integration"
  analysis_round: "01"
  analyst: "Bioinformatics Core"

paths:
  raw: "data"
  out: "outputs"

params:
  seed: 1234

# ==============================================================================
# Individual Omics Modes (at least 2 required for integration)
# ==============================================================================

modes:
  # --- RNA-seq configuration ---
  rna:
    files:
      counts: "rna/counts.csv"
      metadata: "rna/metadata.csv"
      contrasts: "rna/contrasts.csv"

    id_columns:
      gene_id: "gene_id"
      sample_col: "SampleID"

    normalization:
      method: "TMMlogCPM"

    filtering:
      group_col: "condition"
      mode: "adaptive"

    de:
      method: "deseq2"
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5

    effects:
      color: "condition"
      samples: "SampleID"

    qc:
      adaptive_plots: true

    annotation:
      organism: "Homo sapiens"
      id_type: "auto"

    pathway:
      enabled: true
      method: "fgsea"
      databases: ["GO", "KEGG"]
      gmt_file: null          # Custom GMT for non-model organisms; enables the GMT-based multi-ORA fallback (absolute or relative to raw/)

    commentary:
      enabled: true
      backend: "claude-code"

  # --- Proteomics configuration ---
  proteomics:
    engine: "DIANN"

    files:
      protein: "proteomics/protein_matrix.csv"
      metadata: "proteomics/metadata.csv"
      contrasts: "proteomics/contrasts.csv"

    id_columns:
      protein_id: "Protein.Group"
      sample_col: "SampleID"
      protein_annot:
        - "Protein.Names"
        - "Genes"
        - "First.Protein.Description"

    normalization:
      method: "none"  # DIA-NN output already normalized

    imputation:
      method: "perseus_like"
      width: 0.2
      downshift: 1.6

    de:
      method: "limma"
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5

    effects:
      color: "condition"
      samples: "SampleID"

    qc:
      run_umap: true

    annotation:
      organism: "Homo sapiens"
      id_type: "auto"

    pathway:
      enabled: true
      method: "both"
      databases: ["GO", "KEGG"]
      gmt_file: null          # Custom GMT for non-model organisms; enables the GMT-based multi-ORA fallback (absolute or relative to raw/)

    ppi:
      enabled: true
      string_score_threshold: 400

    commentary:
      enabled: true
      backend: "claude-code"

  # --- Metabolomics configuration (optional) ---
  # metabolomics:
  #   input:
  #     format: "processed_wide"
  #     has_group_row: true
  #   files:
  #     data: "metabolomics/metabolites.csv"
  #   normalization:
  #     sample_norm: "sum"
  #     transform: "log2"
  #     scaling: "auto"
  #   de:
  #     method: "t_test"
  #     p_cutoff: 0.05
  #   enrichment:
  #     run_enrichment: true

# ==============================================================================
# Multi-Omics Integration Configuration
# ==============================================================================

  multiomics:
    # --- Gene-protein ID mapping ---
    # Optional: provide custom gene-protein mapping file
    # If not provided, will use gene symbols to map RNA ↔ protein
    gene_protein_mapping_file: null  # "data/gene_protein_mapping.csv"

    # Require 1:1 gene-protein mapping (removes ambiguous mappings)
    require_one_to_one_mapping: false

    # --- Report sections ---
    # Optional per-section switches, for dropping a section a project cannot
    # interpret without editing the shared template. Every section is ON unless
    # listed here as false; omitting this whole block (as every existing config
    # does) renders the report exactly as before.
    report:
      sections:
        # translation_efficiency: false  # protein log2FC - RNA log2FC panels
        # group_distance: false          # per-sample within vs cross-group distance

    # --- Feature selection for integration ---
    feature_selection:
      method: "variance"  # "de", "variance", "combined"
      top_n: 500          # Number of features to select per omics
      min_var_percentile: 50  # For variance method
      # combine_mode: "union"  # For "combined" method: "union" or "intersection"

    # --- Integration methods ---
    integration:
      methods:
        - "DIABLO"  # Supervised (requires condition_column)
        - "SNF"     # Unsupervised clustering
        # - "MOFA2"  # Deferred: requires complex Python setup

      # DIABLO configuration (mixOmics)
      diablo:
        ncomp: 2              # Number of components
        design_matrix: "full" # "full" (all omics connected) or "null"
        cv_folds: 5           # Cross-validation folds

      # SNF configuration
      snf:
        K: 20                 # Number of nearest neighbors
        alpha: 0.5            # Hyperparameter (0-1)
        T: 20                 # Number of iterations
        n_clusters: 2         # Expected number of clusters

    # --- Condition column for supervised methods ---
    condition_column: "condition"  # Must match metadata column name

    # --- Cross-omics enrichment ---
    enrichment:
      run_enrichment: true
      # Fisher's method will combine p-values across omics

      # --- KEGG pathway classes to leave out of the report ---
      # KEGG's reference maps are pan-species, so an organism with no KEGG code
      # of its own is tested against all of them, and maps of organs it does not
      # have can score well purely because the orthologs underneath are generic.
      # Listing a class here removes its pathways from every report section.
      #
      # This is a reporting decision, not a statistical one: enrichment runs
      # over the same pathway universe and the p-values and FDR adjustment are
      # unchanged, so a pathway that stays carries the value it would have had.
      #
      # Both BRITE categories and their subcategories match, e.g.
      #   - "Human Diseases"          # whole category
      #   - "Circulatory system"      # one subcategory, keeping the rest
      # Empty by default: nothing is excluded unless a project asks.
      exclude_pathway_classes: []

      # --- Top pathways of one layer, looked up in another ---
      # Exploratory, off by default. For every pair of layers, both
      # directions: the source layer's top pathways by its own raw p-value (its
      # GSEA result where it has one, otherwise ORA), among the pathways its
      # enrichment step reported, beside what the other layer shows for the
      # same pathways in the same contrast. The KEGG-from-DE fallback reports
      # only pathways past its own cutoff, so for such a layer the ranking is
      # not over every pathway it scored. A layer with no raw p-value column is
      # skipped.
      # Written as cross_lookup_<from>_to_<to>.tsv/.png, plus a report section.
      # Descriptive: nominal p-values, nothing re-tested.
      cross_lookup:
        enabled: false
        top_n: 15

      # --- Pathway enrichment of DIABLO loadings and MOFA2 weights ---
      # "gsea": every feature of a view ranked by its signed loading (DIABLO) or
      #   weight (MOFA2) on each component/factor, then GSEA. Each pathway gets
      #   an NES whose sign follows the axis orientation; the report states
      #   which condition scores higher on each axis.
      # "ora": the top 50 features by absolute loading, then over-representation
      #   (the earlier behaviour).
      # The default changed from ORA to GSEA: a project config with no
      # loadings.method now runs GSEA. Set method: "ora" to keep earlier results.
      # Gene sets: KEGG for organisms with a KEGG code and OrgDb, otherwise the
      # layer's pathway.gmt_file; KEGG compound pathways for metabolites.
      loadings:
        method: "gsea"
        min_size: 10
        max_size: 500

      # --- Enzyme-metabolite pairs ---
      # One row per (enzyme, metabolite) pair that KEGG links through an EC
      # number: the enzyme's own change beside the measured metabolite's, in
      # enzyme_metabolite_pairs.tsv and a report table. An annotation lookup,
      # not a test -- KEGG says the enzyme class can act on the compound, not
      # that it did here. Needs a KEGG organism code and an annotation
      # database; skipped with a note when KEGG cannot be reached.
      enzyme_metabolite:
        enabled: true
        # false also pairs enzymes that did not change themselves
        enzyme_hits_only: true
        # a pair is kept only when enzyme and metabolite share a KEGG pathway,
        # which is what stops cofactor links from flooding the table
        require_shared_pathway: true
        # ATP, NAD(H), water and the like: in thousands of reactions, so a pair
        # with one says nothing about the enzyme
        drop_currency_metabolites: true
        # every changed enzyme is listed, with a note where nothing it acts on
        # was measured; false keeps only the pairs
        list_unpaired_enzymes: true

      # --- KEGG reference maps in KO space (pathview) ---
      # Only consulted when the organism has no OrgDb, which is the branch that
      # would otherwise produce no pathway maps at all. The maps are KEGG's
      # organism-independent reference maps, whose gene boxes are KEGG Orthology
      # groups, so every feature reaches them through the KO map below.
      pathview:
        # Feature -> KEGG Orthology map, TSV with columns: omics, feature_id, KO.
        # Required: without it there is no way to place this run's features on a
        # KEGG map, and no maps are drawn.
        # See utils/build_feature_ko_map.R for one way to build it.
        ko_map: null  # "multiomics/feature_to_ko.tsv"

        # Set false to skip pathway maps entirely.
        run_pathview: true

        # Max pathways to render per contrast. The config validator fills this
        # with 5 when it is absent, so 5 is the value to match here.
        top_n: 5

# ==============================================================================
# Global design (used by single-omics DE and multi-omics integration)
# ==============================================================================

design:
  condition_column: "condition"
  design_formula: "~ condition"
  contrasts:
    - "treated - control"
  reference_level: "control"
  batch_column: null

# ==============================================================================
# Global settings
# ==============================================================================

global:
  omics_present:
    - transcriptomics
    - proteomics
    # - metabolomics
  organism: "Homo sapiens"
  metadata: "data/metadata.csv"

output:
  output_dir: "outputs"
  report_format: "html"
