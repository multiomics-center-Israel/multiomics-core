# ==============================================================================
# GT15 genotype metabolomics analysis (2024 vs 2013)
# Converted from: metabolomics_pipeline/config_GT15.yml
# ==============================================================================

project:
  dir: "/home/ozsol/MultiOmics_Projects/MultiOmics_Projects/2025_06_Yonatan_Sharabi"
  name: "GT15"
  analysis_round: "01"

paths:
  raw: "Results/Metabolomics"
  out: "Results/Metabolomics"

params:
  seed: 1234

modes:
  metabolomics:

    # ---- Input specification ----
    input:
      format: "processed_wide"
      has_group_row: true        # Row 2 = condition assignments per sample

    files:
      data: "01.Lab_res/GT15_flt.level1.txt"
      metadata: null             # Auto-generated from group row

    # ---- Feature ID construction ----
    id_columns:
      feature_id_col: "Molecule"
      annotation_cols:
        - "Molecule"
        - "HMDB"

    # ---- Preprocessing: missingness (soft filter) ----
    preprocessing:
      feat_missing_threshold: 0.50   # drop metabolites missing in >50% of samples
      sample_missing_threshold: 1.0  # disable sample filtering (keep all samples)

    # ---- Normalization ----
    # Here the normalization and scaling match the one considered by default in metaboAnalyst
    # Original: SumNorm → LogNorm → MeanCenter
    normalization:
      input_already_normalized: false
      sample_norm: "sum"         # SumNorm
      transform: "log2"         # LogNorm
      scaling: "auto"           # Autoscale (mean-center + divide by SD)
      pseudocount: 1
      na_policy: "lod"
      na_lod_fraction: 0.2 # 1/5 of the smallest value is the psudeo-count.

    # ---- Effects (for QC plots) ----
    effects:
      samples: "sample_id"
      color: "condition"

    # ---- QC plot settings ----
    qc:
      adaptive_plots: true
      thresholds:
        min_samples_for_pca3d: 10
        max_samples_for_heatmaps: 120

    # ---- Differential expression ----
    de:
      method: "t_test"
      condition_column: "condition"
      contrasts:
        - "GT15_2024 - GT15_2013"
      p_cutoff: 0.05
      pval_cutoff: 0.05
      linear_fc_cutoff: 2       # log2FC threshold = 1 → 2^1 = 2

    # ---- Random forest feature importance ----
    rf:
      run_rf: true
      n_trees: 500
      importance: "permutation"
      top_n: 20
      seed: 1234

    # ---- PLS-DA multivariate analysis ----
    plsda:
      run_plsda: true
      vip_top_n: 15
      colors:
        - "#E41A1C"
        - "#377EB8"

    # ---- Pathway enrichment ----
    enrichment:
      run_enrichment: true
      libraries: []
      ## You need to provide GMT files for the QEA and ssGSEA to work.
      gmt_file:
        - "/mnt/c/Users/ozsol/Technion/MultiOmicsCenter - Documents/Projects/2025_06_Yonatan_Sharabi/Results/Metabolomics/03.Analysis/kegg_legionella_compound_pathway.gmt"
        - "/mnt/c/Users/ozsol/Technion/MultiOmicsCenter - Documents/Projects/2025_06_Yonatan_Sharabi/Results/Metabolomics/03.Analysis/smpdb_metabolites_pathway.gmt"
      mapping_file: "data/HMDB2kegg_cpd.Jan2026.v2.txt"


## MetaboAnalyst: How to treat missing value?
## Left-censored data estimation: it assumes that the true value of an observation is known to be below a certain threshold (the LoD), but its exact value is unknown. The default method LoD (limit of detection) will replace all the missing values with 1/5 of the minimum positive values of individual features as proxies of their detection limits. Alternatively, the Quantile Regression Imputation of Left-Censored data (QRILC) method which imputes missing data by modeling each feature’s low tail as log-normal and sampling replacements.
## Univariate statistical methods: this approach replaces missing values by mean/median/min based on the non-missing values of the feature;
## Multivariate statistical methods: these methods leverage correlations between features or samples to estimate the missing entries, including k-nearest neighbours based on similar features - KNN (feature-wise), k-nearest neighbours based on similar samples - KNN (sample-wise), probabilistic PCA (PPCA), Bayesian PCA (BPCA) method, singular value decomposition (SVD) (ref), and missForest based on random forest(ref). Note k is set to 10 for KNN; the max missing values is set to 30000 for missForest due to its computational intensive nature.


