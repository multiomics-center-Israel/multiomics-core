# ==============================================================================
# End-to-end fixture -- proteomics batch handling
# Same shipped synthetic data and settings as e2e_proteomics_config.yaml, plus a
# synthetic Batch column added by the test's staging function (the shipped
# metadata.csv is never modified). Batch is corrected with ComBat for QC and,
# with de_mode left null, modelled as a limma covariate. Clustering is on so the
# test can check which matrix it used. `project.dir` is overridden by
# run_omic_e2e().
# ==============================================================================

project:
  dir: "__OVERRIDDEN_BY_HELPER__"
  name: "e2e_proteomics_batch"
  analysis_round: "T01"

paths:
  raw: "data"
  out: "outputs"

params:
  seed: 1

modes:
  proteomics:

    engine: "DIANN"
    scale_in: "linear"

    files:
      protein: "proteomics/protein_matrix.csv"
      sample_map: "proteomics/sample_map.csv"
      metadata: "proteomics/metadata.csv"
      contrasts: "proteomics/contrasts.csv"

    id_columns:
      protein_id: "Protein.Group"
      sample_col: "SampleID"
      protein_annot:
        - "Protein.Names"
        - "Genes"
        - "First.Protein.Description"
      map_from: "sample_orig_name"
      map_to: "SampleID"

    filtering:
      remove_contaminants: true
      contaminant_prefix: "cRAP-"
      min_count:
        default: 3
      min_groups: 1

    normalization:
      method: "none"

    batch_correction:
      batch_col: "Batch"
      method: "combat"
      group_col: "Condition"
      preserve_condition: true
      de_mode: null        # resolves to "covariate" because a correction is configured

    imputation:
      # Multi-imputation is seeded (set.seed(params.seed + i)) so the run is
      # reproducible. Fewer repetitions than production keeps the test light.
      multi_imputation: true
      method: "perseus_like"
      no_repetitions: 4
      min_no_passed: 3
      width: 0.2
      downshift: 1.6

    de:
      method: "limma"
      # Per-imputation votes use the raw p-value. The consensus call is still
      # gated on the summarised adjusted p (padj.imputs <= p_cutoff) in
      # summarize_limma_mult_imputation(), so significance here is adjusted-p.
      use_adj_for_pass1: false
      p_cutoff: 0.05
      linear_fc_cutoff: 1.5
      p_adjust_method: "BH"
      paired: false

    de_table:
      id_col: "FeatureID"

    effects:
      color: "Condition"
      shape: null
      samples: "SampleID"

    clustering:
      enabled: true
      group_col: "Condition"
      steps:
        hierarchical:
          enabled: true
          distance: "euclidean"
          linkage: "complete"
          k: null
        partition:
          enabled: false
          k_max: 4
        binary_patterns:
          enabled: false

    annotation:
      organism: "Homo sapiens"
      id_type: "auto"
      skip_annotation: true

    pathway:
      enabled: false

    ppi:
      enabled: false

    domain_analysis:
      enabled: false

    advanced_stats:
      enabled: false

    commentary:
      enabled: false

    excel:
      group_cv: false
