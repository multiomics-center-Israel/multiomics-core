name: Build and Push Docker Image

# Build the multiomics-core image and push it to GitHub Container Registry
# (ghcr.io) so end users can `docker pull` instead of building locally
# (~30 min on first run otherwise). Image tags:
#   - `main`             — bleeding-edge default branch
#   - `Lipidomics_dor`   — pre-merge lipidomics branch (for Ifat / lipidomics testers)
#   - `MO_dor`           — pre-merge multi-omics branch
#   - `vX.Y.Z`           — tagged releases (cut with `git tag` + `git push origin vX.Y.Z`)
#   - `latest`           — most recent default-branch build
on:
  push:
    branches:
      - main
      - Lipidomics_dor
      - MO_dor
    tags:
      - 'v*'
    paths:
      # Skip rebuilds when only docs / non-runtime files change.
      - 'Dockerfile'
      - '.dockerignore'
      - 'renv.lock'
      - '.Rprofile'
      - 'renv/**'
      - 'R/**'
      - 'run.R'
      - '_targets.R'
      - 'wizard.html'
      - 'wizard_defaults.template.json'
      - 'tools/**'
      - 'utils/**'
      - 'config/templates/**'
      - 'data/example_*/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name for ghcr.io
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
